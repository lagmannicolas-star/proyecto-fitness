<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo Fit · Proveedores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: franja verde de demo, encabezado negro, portada negra con la barra; contenido claro en filas comparables y paneles con pestañas. */

:root, :root[data-theme="dark"]{
 --bg:#FDFAF5;--surface:#FDFAF5;--surface-2:rgba(16,23,31,.04);--ink:#10171F;--muted:rgba(16,23,31,.72);--line:rgba(16,23,31,.16);--field-line:rgba(16,23,31,.4);
 --accent:#A5CC21;--on-accent:#10171F;--accent-text:#10171F;--accent-soft:rgba(165,204,33,.18);
 --strong-bg:#10171F;--strong-fg:#FDFAF5;--strong-muted:rgba(253,250,245,.76);--strong-accent:#A5CC21;--strong-line:rgba(253,250,245,.25);--strong-surface:#10171F;
 --plate-red:#A5CC21;--plate-blue:#10171F;--plate-yellow:#A5CC21;--plate-green:#A5CC21;--plate-white:#FDFAF5;--iron:#10171F;--steel:#FDFAF5;--collar:#A5CC21;
 --ok-bg:rgba(165,204,33,.18);--ok-fg:#10171F;--warn-bg:rgba(16,23,31,.06);--warn-fg:#10171F;--bad-bg:rgba(16,23,31,.06);--bad-fg:#10171F;
 --shadow:0 2px 12px rgba(16,23,31,.05);--scrim:rgba(16,23,31,.6);--display:'Barlow',system-ui,sans-serif;--body:'Barlow',system-ui,sans-serif;--r:12px;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}

/* Tipografía */
.display{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1;text-wrap:balance;letter-spacing:.005em}
h1.display{font-size:clamp(2.5rem,6vw,4.6rem)}
h2.display{font-size:clamp(1.9rem,3.6vw,2.6rem)}
.h-page{font-size:clamp(2.1rem,4.6vw,3.3rem)!important}
.h-card{font-size:1.6rem!important}
.eyebrow{font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-outline{background:transparent;border-color:var(--field-line);color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-fg)}
.btn-sm{min-height:44px;padding:0 14px;font-size:.92rem}
.btn-lg{min-height:54px;padding:0 28px;font-size:1.05rem}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--accent-text);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* Franja de demo y encabezado */
.led{--led-screen:#10171F;--led-r:#A5CC21;--led-b:#A5CC21;--led-y:#A5CC21;--led-g:#A5CC21;--led-w:#FDFAF5;--led-frame:#10171F;--led-edge:#10171F;background:var(--led-frame)}
.led::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--led-r) 0 25%,var(--led-b) 25% 50%,var(--led-y) 50% 75%,var(--led-g) 75% 100%)}
.led-in{display:flex;align-items:center;gap:12px;padding-block:8px}
.led-tag{flex:none;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#FDFAF5;border:1px solid var(--led-edge);border-radius:4px;padding:2px 6px}
.led-win{position:relative;flex:1 1 0;min-width:0;height:44px;overflow:hidden;border-radius:6px;background:var(--led-screen);box-shadow:inset 0 0 0 1px var(--led-edge)}
.led-win::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at center,transparent 0 1.15px,var(--led-screen) 1.6px);background-size:4px 4px;opacity:.4}
.led-track{display:flex;width:max-content;animation:led-run 24s linear infinite}
.led-msg{flex:none;margin-right:72px;white-space:nowrap;font-family:'VT323','Courier New',monospace;font-size:2.05rem;line-height:44px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;color:var(--led-g);text-shadow:0 0 6px currentColor,0 0 16px currentColor}
.led-msg.c0{color:var(--led-r)}
.led-msg.c1{color:var(--led-b)}
.led-msg.c2{color:var(--led-y)}
.led-msg.c3{color:var(--led-g)}
.led-msg::after{content:"";display:inline-block;width:9px;height:9px;margin-left:72px;border-radius:50%;background:currentColor;vertical-align:middle;box-shadow:0 0 8px currentColor}
.led-msg b{font-weight:400;color:var(--led-w);text-shadow:0 0 6px rgba(253,250,245,.75)}
a.led-msg{cursor:pointer}
a.led-msg:hover{text-decoration:underline}
.led:hover .led-track,.led:focus-within .led-track{animation-play-state:paused}
@keyframes led-run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sr{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .led-track{animation:none} }
@media (max-width:560px){ .led-msg{font-size:1.6rem} }
.demolinks{font-size:.82rem;color:var(--muted)}
.demolinks a{color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.top{background:var(--strong-bg);color:var(--strong-fg);border-bottom:1px solid var(--strong-line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.03em;text-transform:uppercase;color:var(--strong-fg)}
.brand svg{flex:none}
.brand em{font-style:normal;color:var(--strong-accent)}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.navlink{background:none;border:0;min-height:44px;padding:0 12px;font-weight:600;cursor:pointer;color:var(--strong-muted)}
.navlink:hover{color:var(--strong-fg)}
.navlink[aria-current="page"]{color:var(--strong-fg);box-shadow:inset 0 -3px 0 var(--strong-accent)}
.top .btn-outline{border-color:var(--strong-accent);color:var(--strong-accent)}
.who{font-weight:600;color:var(--strong-muted)}

/* Bloques negros */
.dark{background:var(--strong-bg);color:var(--strong-fg)}
.dark .eyebrow{color:var(--strong-accent)}
.dark .lead,.dark .muted{color:var(--strong-muted)}
.dark .btn-accent{background:var(--strong-accent);color:var(--strong-bg)}
.dark .btn-outline{border-color:var(--strong-line);color:var(--strong-fg)}
.dark .display em{font-style:normal;color:var(--strong-accent)}
.hero{padding-block:52px 44px}
.hero-in{display:flex;flex-direction:column;gap:20px}
.band-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding-block:44px}

/* La barra */
.lift{display:flex;flex-direction:column;gap:18px;margin-top:12px;padding:24px;border:1px solid var(--strong-line);border-radius:14px;background:var(--strong-surface)}
.barbell{display:flex;align-items:center;justify-content:center;gap:3px;height:100px;--k:1}
.barbell span{flex:none;border-radius:4px}
.barbell .side-l,.barbell .side-r{display:flex;align-items:center;gap:3px;border-radius:0}
.barbell .bb-sleeve{width:26px;height:14px;background:var(--steel)}
.barbell .bb-collar{width:10px;height:32px;background:var(--collar)}
.barbell .bb-bar{flex:1 1 40px;min-width:24px;height:9px;background:var(--steel);border-radius:0}
.plate{height:100px}
.plate.k25{width:calc(22px*var(--k));background:var(--plate-red)}
.plate.k20{width:calc(18px*var(--k));background:var(--plate-blue)}
.plate.k15{width:calc(14px*var(--k));background:var(--plate-yellow)}
.plate.k10{width:calc(11px*var(--k));background:var(--plate-green)}
.plate.k5{width:calc(9px*var(--k));height:60px;background:var(--plate-white)}
.side-l .plate.in{animation:slideL .3s ease-out}
.side-r .plate.in{animation:slideR .3s ease-out}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.lift-ui{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px}
.lift-kg{display:flex;flex-direction:column}
.lift-btns{display:flex;flex-wrap:wrap;gap:8px}
.platebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--strong-line);background:transparent;color:var(--strong-fg);font-weight:600;cursor:pointer}
.platebtn:hover{border-color:var(--strong-accent)}
.platebtn i{width:14px;height:14px;border-radius:50%;border:1px solid var(--strong-line)}
.bigfig{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.05}
@media (max-width:560px){
  .barbell{--k:.6;height:72px}
  .plate{height:72px}
  .plate.k5{height:44px}
  .barbell .bb-sleeve{width:12px}
  .lift{padding:18px}
}

/* Secciones de la portada */
.section{padding-block:44px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:32px 56px}
.mv > div{display:flex;flex-direction:column;gap:10px}
.mv p.big{font-size:1.3rem;line-height:1.4;max-width:34ch}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:24px;margin-top:36px}
.value{display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:3px solid var(--accent)}
.value h3{font-size:1.15rem;font-weight:700}
.try{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:20px}
.try-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px}
.try-top .field{flex:1 1 260px}
.try-q{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);padding:0;border:0;background:transparent}
.try-rows{display:flex;flex-direction:column;gap:14px}
.try-row{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(120px,auto);gap:4px 16px;align-items:center}
.try-row .n{font-weight:600}
.try-row .t{font-weight:700;text-align:right}
.try-bar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.try-bar i{display:block;height:100%;border-radius:7px;background:var(--iron);transition:width .25s ease}
.try-row.best .try-bar i{background:var(--accent)}
.try-row.best .t{color:var(--accent-text)}
.try-row.off{opacity:.6}
.try-sum{font-size:1.1rem;font-weight:600}
@media (max-width:560px){ .try-row{grid-template-columns:1fr auto} .try-row .try-bar{grid-column:1 / -1;grid-row:2} }
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.space-card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;transition:border-color .12s ease,transform .12s ease}
.space-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.space-card b{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;line-height:1.1}
.space-card .cats{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:.88rem;font-weight:600;color:var(--accent-text)}
.cat-art{display:block;background:#10171F;line-height:0}
.cat-art svg{display:block;width:100%;height:auto}
.cat-art img,.space-art img{display:block;width:100%;aspect-ratio:320/142;object-fit:cover}
.space-art img{aspect-ratio:320/172}
.cat-body{display:flex;flex-direction:column;gap:2px;padding:14px 18px 16px}
.space-art{display:block;background:#10171F;line-height:0}
.space-art svg{display:block;width:100%;height:auto}
.space-body{display:flex;flex-direction:column;gap:6px;padding:18px 22px 20px}
#cats{scroll-margin-top:12px}
.linkbtn.wa{display:inline-flex;align-items:center;gap:6px}
.field textarea{width:100%;padding:10px 12px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.cat-card{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;transition:border-color .12s ease,transform .12s ease}
.cat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat-card b{display:block;font-family:var(--display);font-size:1.5rem;text-transform:uppercase;line-height:1.1}
.disc{flex:none;width:46px;height:46px;border-radius:50%;border:11px solid var(--iron);background:var(--surface)}
.disc.red{border-color:var(--plate-red)}.disc.blue{border-color:var(--plate-blue)}.disc.yellow{border-color:var(--plate-yellow)}.disc.green{border-color:var(--plate-green)}.disc.white{border-color:var(--steel)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:24px;counter-reset:paso}
.step{display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:3px solid var(--ink)}
.step::before{counter-increment:paso;content:"Paso " counter(paso);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.step h3{font-size:1.2rem;font-weight:700}
.foot{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.9rem}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px}

/* Formularios */
.search{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end}
.search .btn{min-height:48px;padding-inline:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:.85rem;font-weight:600}
.field input:not([type=range]):not([type=checkbox]),.field select{height:48px;width:100%;padding:0 12px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field .hint{font-size:.8rem;color:var(--muted)}
.field .err{font-size:.85rem;color:var(--bad-fg);font-weight:600}
.stepper{display:flex}
.stepper button{flex:none;width:48px;height:48px;border:1px solid var(--field-line);background:var(--surface-2);font-size:1.3rem;font-weight:700;cursor:pointer}
.stepper button:first-child{border-radius:8px 0 0 8px}
.stepper button:last-child{border-radius:0 8px 8px 0}
.field .stepper input{border-radius:0;border-left:0;border-right:0;text-align:center;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:48px;padding:0 13px;border:1px solid var(--field-line);border-radius:999px;background:var(--surface);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
legend{padding:0;font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase}

/* Catálogo */
.vchips{display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.vchip:hover{border-color:var(--accent)}
.vchip.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.vchip .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.78rem}
.models{display:flex;flex-direction:column}
.model{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:12px 32px;padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:16px}
.model-h{display:flex;flex-direction:column;gap:4px;min-width:0}
.model h2{font-size:1.25rem;font-weight:700;line-height:1.25}
.model.hit h2{color:var(--accent-text)}
@media (max-width:760px){ .model{grid-template-columns:1fr} }
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.legend .vchip{min-height:32px;cursor:default}
.clave{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:var(--r);background:var(--surface-2);max-width:90ch}
.q-box{display:flex;flex-direction:column;gap:10px}
.q-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}
.q-item{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:56px;padding:10px 14px;border-radius:8px;border:1px solid var(--strong-line);background:var(--strong-surface);color:var(--strong-fg);cursor:pointer}
.q-item span{color:var(--strong-muted);font-size:.85rem}
.q-item:hover{border-color:var(--strong-accent)}
.q-none,.q-more{color:var(--strong-muted);font-size:.9rem}

/* Comparación */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;color:var(--muted);font-size:.9rem}
.page{padding-block:28px 56px;display:flex;flex-direction:column;gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--surface-2);font-size:.88rem;font-weight:600}
.dark .chip{background:var(--strong-line);color:var(--strong-fg)}
.controls{display:flex;flex-wrap:wrap;gap:16px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;align-items:flex-start}
.controls .field.q{flex:0 1 200px}
.controls .field.cp{flex:0 1 170px}
.controls .field.s{flex:1 1 380px}
.controls .field.v{flex:1 1 220px}
#cmp-results{display:flex;flex-direction:column;gap:24px}
.hls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.hl{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:var(--r);background:var(--surface-2)}
.hl.top1{background:var(--strong-bg);color:var(--strong-fg)}
.hl.top1 .k{color:var(--strong-accent)}
.hl.top1 .muted{color:var(--strong-muted)}
.hl .k{font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hl .v{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1}
.offers{display:flex;flex-direction:column;gap:12px}
.offer{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(0,3fr) minmax(170px,1fr);gap:16px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.offer.best{border-color:var(--accent);box-shadow:var(--shadow)}
.offer-v{display:flex;flex-direction:column;gap:4px;min-width:0}
.offer-v b{font-size:1.3rem;line-height:1.2}
.offer-v .k{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.78rem;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:600}
.offer-buy{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.offer-buy .t{display:flex;flex-direction:column}
.offer-buy .t span{font-size:.78rem;color:var(--muted);font-weight:600}
.offer-buy .t b{font-family:var(--display);font-size:1.9rem;line-height:1.05}
@media (max-width:860px){ .offer{grid-template-columns:1fr} }
@media (max-width:520px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tag{display:inline-flex;align-self:flex-start;padding:3px 9px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tag.alt{background:var(--surface-2);color:var(--ink)}
.note{color:var(--muted);font-size:.9rem;max-width:75ch}
.alert{padding:12px 16px;border-radius:8px;background:var(--warn-bg);color:var(--warn-fg);font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad-fg)}
.alert.ok{background:var(--ok-bg);color:var(--ok-fg)}
.alert .linkbtn{color:inherit;text-decoration:underline}

/* Paneles, tarjetas y tablas */
.split{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
.split > .main{flex:999 1 480px;min-width:0}
.split > .side{flex:1 1 300px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px}
.card.strong{background:var(--strong-bg);color:var(--strong-fg);border-color:var(--strong-line)}
.card.strong .muted{color:var(--strong-muted)}
.card.strong .rows .total{border-color:var(--strong-line)}
.card.strong .accent{color:var(--strong-accent)}
.rows{display:flex;flex-direction:column;gap:10px}
.rows > div{display:flex;justify-content:space-between;gap:16px}
.rows .total{padding-top:12px;border-top:1px solid var(--line);font-weight:700;font-size:1.2rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;min-height:46px;padding:0 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);font-size:.78rem}
.wsel{height:40px;padding:0 8px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.tab .count.neutral{background:var(--surface-2);color:var(--ink)}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.linkrow input{flex:1 1 260px;min-width:0;height:46px;padding:0 12px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.tile .s.up{color:var(--ok-fg);font-weight:600}
.tile .s.down{color:var(--bad-fg);font-weight:600}
.tile.main .s.up{color:var(--strong-accent)}
.tile.main .s.down{color:#A5CC21}
.alerts{display:flex;flex-direction:column}
.al{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al .st{flex:none;min-width:86px;justify-content:center}
.al-b{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){ .tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .tiles.six{grid-template-columns:1fr} }
.tile-link{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s ease,transform .12s ease}
.tile-link:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile.main.tile-link:hover{border-color:var(--strong-accent)}
.tile .go{margin-top:8px;font-size:.84rem;font-weight:700;color:var(--accent-text)}
.tile.main .go{color:var(--strong-accent)}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px}
.filters .field{flex:0 1 240px}
.sumline{font-size:1.02rem}
.cell-in{width:100%;min-width:120px;height:40px;padding:0 10px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
tr.editing{background:var(--accent-soft)}
.card.hit{border-color:var(--accent);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:2px;padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile.main{background:var(--strong-bg);color:var(--strong-fg);border-color:var(--strong-line)}
.tile.main .k{color:var(--strong-accent)}
.tile.main .s{color:var(--strong-muted)}
.tile .k{font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1.1}
.tile .s{font-size:.88rem;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:12px 14px;text-align:left;vertical-align:middle}
thead th{background:var(--surface-2);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr{border-top:1px solid var(--line)}
td.r,th.r{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:.82rem;color:var(--muted);font-weight:400}
.st{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok-fg)}.st.warn{background:var(--warn-bg);color:var(--warn-fg)}.st.bad{background:var(--bad-bg);color:var(--bad-fg)}.st.neu{background:var(--surface-2);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions.nw{flex-wrap:nowrap}
td.nw{white-space:nowrap}
.empty{display:flex;flex-direction:column;gap:12px;padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--field-line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.list > div{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:14px 0;border-top:1px solid var(--line)}
.list > div:first-child{border-top:0}
.list .who2{flex:1 1 200px;min-width:0}
.pctbox{display:flex;align-items:center;gap:8px}
.pctbox input{width:84px;height:44px;padding:0 10px;border:1px solid var(--field-line);border-radius:8px;background:var(--surface)}
.bar90{display:flex;gap:3px;height:16px}
.bar90 i{display:block;border-radius:3px}
.bar90 .a{background:var(--strong-accent)}.bar90 .b{background:var(--collar)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.hbar > span:first-child{display:flex;flex-direction:column;min-width:0}
.card.strong input[type=range],.dark input[type=range]{accent-color:var(--strong-accent)}
.track{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.hbars.wide .hbar{grid-template-columns:minmax(200px,340px) minmax(0,1fr) minmax(44px,auto)}
.hbars.wide .hbar > b{text-align:right}
.cellbar{display:grid;grid-template-columns:minmax(110px,auto) minmax(80px,1fr);align-items:center;gap:12px}
tfoot td{padding:12px 14px;border-top:2px solid var(--ink);background:var(--surface-2)}
@media (max-width:560px){ .hbar,.hbars.wide .hbar{grid-template-columns:1fr auto} .hbar .track{grid-column:1 / -1;grid-row:2} }

/* Modal y aviso */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:460px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);max-height:100%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){
  .btn,.cat-card,.space-card,.try-bar i,.tile-link{transition:none}
  .tile-link:hover{transform:none}
  .cat-card:hover,.space-card:hover{transform:none}
  .side-l .plate.in,.side-r .plate.in{animation:none}
}

/* ---------- Administrador ---------- */
.adm{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.adm > .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--strong-bg);color:var(--strong-fg);display:flex;flex-direction:column;gap:22px;padding:20px 14px;border-right:1px solid var(--strong-line)}
.side-brand{cursor:default;padding:0 8px;font-size:1.3rem}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--strong-muted);font-weight:600;cursor:pointer;text-align:left;transition:background .12s ease,color .12s ease}
.snav button:hover{background:var(--strong-surface);color:var(--strong-fg)}
.snav button[aria-current="page"]{background:var(--strong-surface);color:var(--strong-fg);box-shadow:inset 3px 0 0 var(--strong-accent)}
.snav button[aria-current="page"] .ico{color:var(--strong-accent)}
.snav .ico{flex:none}
.snav .count{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#A5CC21;color:#10171F;font-size:.76rem;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px 8px 0;border-top:1px solid var(--strong-line)}
.side-who{display:flex;align-items:center;gap:10px}
.side-who > span:last-child{display:flex;flex-direction:column;line-height:1.25}
.side-who .small{color:var(--strong-muted)}
.avatar{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--strong-accent);color:#10171F;font-weight:700}
.adm > .side .btn-outline{border-color:var(--strong-line);color:var(--strong-fg);justify-content:flex-start}
.adm > .side .demolinks,.adm > .side .demolinks a{color:var(--strong-muted);font-size:.78rem}
.adm-main{min-width:0;display:flex;flex-direction:column}
.adm-top{padding:30px 36px 0;display:flex;flex-direction:column;gap:6px}
.adm-top .h-page{font-size:clamp(2rem,3.6vw,2.8rem)!important}
.adm-body{padding:22px 36px 56px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.adm .card{border-radius:14px;box-shadow:0 1px 2px rgba(16,23,31,.04),0 6px 20px rgba(16,23,31,.04)}
.adm .tablewrap{border-radius:14px}
.adm .tablewrap.flat{border-radius:10px}
.adm .h-card{font-size:1.38rem!important}
.ch{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ch-t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text)}
.ic.sm{width:32px;height:32px;border-radius:9px}
.legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted)}
.legend .sq{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--ink);vertical-align:middle}
.legend .sq.we{background:var(--steel)}
.legend .sq.acc{background:var(--accent)}
/* Cuadritos */
.tiles.eight,.tiles.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){ .tiles.eight{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){ .tiles.kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .tiles.eight{grid-template-columns:1fr} .tiles.kpis{gap:10px} .tiles.kpis .tile{padding:14px} .tiles.kpis .tile .v{font-size:1.65rem} .tiles.kpis .ic.sm{display:none} }
.adm .tile{border-radius:14px;padding:16px 18px;gap:4px;box-shadow:0 1px 2px rgba(16,23,31,.04)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.adm .tile .v{font-size:2rem}
.tile.main .ic{background:rgba(16,23,31,.16);color:var(--strong-accent)}
.tile .s .vs{font-weight:400;color:var(--muted)}
.tile.main .s .vs{color:var(--strong-muted)}
.adm .tile .go{margin-top:auto;padding-top:8px}
.sum-head,.stat-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.sum-head > div:first-child{flex:1 1 320px;display:flex;flex-direction:column;gap:4px}
.field.period{min-width:220px;flex:0 1 260px}
.stat-head{justify-content:flex-start}
.stat-when{display:flex;flex-direction:column;padding-bottom:4px}
.demo-note{display:flex;align-items:center;gap:8px;margin-top:-8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.grid2.wide-l{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:1000px){ .grid2,.grid2.wide-l{grid-template-columns:minmax(0,1fr)} }
/* Gráfico de columnas */
.cchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.cc-y{display:flex;flex-direction:column;justify-content:space-between;height:200px;font-size:.75rem;color:var(--muted);text-align:right;transform:translateY(-.5em)}
.cc-area{min-width:0}
.cc-cols{display:flex;align-items:flex-end;gap:3px;height:200px;border-bottom:1px solid var(--field-line);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 50%}
.cc-col{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;border-radius:4px 4px 0 0}
.cc-col:hover{background:var(--surface-2)}
.cc-col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--ink);transition:height .3s ease}
.cc-col.we i{background:var(--steel)}
.cc-col.today i{background:var(--accent)}
.hours .cc-col i{background:var(--steel)}
.hours .cc-col.peak i{background:var(--accent)}
.cc-x{display:flex;gap:3px;margin-top:6px;font-size:.72rem;color:var(--muted)}
.cc-x span{flex:1 1 0;min-width:0;overflow:visible;white-space:nowrap}
.mini3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini3 > div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.mini3 b{font-family:var(--display);font-size:1.5rem;line-height:1}
@media (max-width:560px){ .mini3{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Mapa de calor */
.hm-wrap{overflow-x:auto;display:flex;flex-direction:column;gap:10px}
.hm{display:grid;grid-template-columns:34px repeat(24,minmax(12px,1fr));gap:3px;min-width:420px;align-items:center}
.hm-h{font-size:.68rem;color:var(--muted)}
.hm-d{font-size:.78rem;font-weight:600;color:var(--muted)}
.hm-c,.hm-key i{display:block;aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--accent) calc(var(--a) * 100%),var(--surface-2))}
.hm-key{display:flex;align-items:center;gap:4px}
.hm-key i{width:14px}
/* Barras con nombre */
.lbars{display:flex;flex-direction:column;gap:12px;flex:1 1 240px;min-width:0}
.lbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:center}
.lbar .track{grid-column:1 / -1;height:8px;border-radius:4px}
.lbar .track i{border-radius:4px}
.lb-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.donut-row{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px}
.donut{position:relative;flex:none;width:150px;height:150px}
.donut svg{width:100%;height:100%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c b{font-family:var(--display);font-size:1.9rem;line-height:1}
/* Embudo */
.funnel{display:flex;flex-direction:column;gap:6px}
.fn-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) minmax(56px,auto);align-items:center;gap:14px}
.fn-bar{height:30px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fn-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--ink)));border-radius:6px}
.fn-n{text-align:right;font-family:var(--display);font-size:1.4rem}
.fn-step{display:flex;align-items:center;gap:6px;padding-left:calc(min(220px,40%) + 14px)}
@media (max-width:560px){ .fn-row{grid-template-columns:minmax(0,1fr) auto} .fn-bar{grid-column:1 / -1;grid-row:2;height:22px} .fn-step{padding-left:0} }
/* Rankings */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rk{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.rank li:nth-child(-n+3) .rk{background:var(--ink);color:var(--bg)}
.rk-t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.rk-t .track{flex:1 1 100%;height:6px;border-radius:3px}
.rk-t .track i{border-radius:3px}
.rank.miss li .rk{background:var(--warn-bg);color:var(--warn-fg)}
.miss-card{border-color:color-mix(in srgb,var(--warn-fg) 30%,var(--line))}
.miss-card .ic{background:var(--warn-bg);color:var(--warn-fg)}
/* Mes a mes */
.mchart{display:flex;align-items:flex-end;gap:14px;overflow-x:auto;padding-top:4px}
.mc-col{flex:1 0 110px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mc-v{font-weight:700;font-size:.9rem}
.mc-bar{display:flex;align-items:flex-end;width:100%;max-width:90px;height:170px}
.mc-bar i{position:relative;display:flex;align-items:flex-end;width:100%;background:var(--ink);border-radius:8px 8px 0 0;overflow:hidden}
.mc-bar em{display:block;width:100%;background:var(--accent)}
/* Ingreso */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,rgba(16,23,31,.22),transparent 60%),var(--strong-bg)}
.login-card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:18px;background:var(--strong-surface);color:var(--strong-fg);border:1px solid var(--strong-line);box-shadow:0 30px 80px rgba(16,23,31,.4)}
.login-card .brand{cursor:default}
.login-card h1{font-size:2.6rem}
.login-card .muted,.login-card .note,.login-card .demolinks,.login-card .demolinks a{color:var(--strong-muted)}
.login-card .btn-accent{background:var(--strong-accent);color:#10171F}
/* Celular y tablet: el menú pasa arriba */
@media (max-width:960px){
  .adm{grid-template-columns:1fr}
  .adm > .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px 0}
  .side-brand{padding:0}
  .snav{order:3;flex:1 1 100%;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px 8px}
  .snav::-webkit-scrollbar{display:none}
  .snav button{flex:none;white-space:nowrap;min-height:44px}
  .snav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--strong-accent)}
  .side-foot{margin:0 0 0 auto;padding:0;border:0;flex-direction:row;align-items:center}
  .side-who,.adm > .side .demolinks{display:none}
  .adm-top{padding:22px 16px 0}
  .adm-body{padding:18px 16px 48px}
}
/* Exportar, catálogo, fotos, usuarios e historial */
.xbar{display:flex;flex-wrap:wrap;gap:8px}
.xrow{display:flex;justify-content:flex-end}

function priceCheck(d,selfId,vendorId,prev){

  var k=vkey(d.category,d.model,d.size), others=db.offers.filter(function(o){ return o.id!==selfId&&o.vendorId!==vendorId&&o.price>0&&o.status!=='rejected'&&o.unit===d.unit&&vkey(o.category,o.model,o.size)===k; }).map(function(o){ return o.price; }).sort(function(a,b){ return a-b; });
  if(others.length){
    var mid=others.length%2?others[(others.length-1)/2]:(others[others.length/2-1]+others[others.length/2])/2, r=d.price/mid;
    if(r<0.5) return {kind:'low',pct:Math.round((1-r)*100),ref:mid,n:others.length,text:'Es '+Math.round((1-r)*100)+'% más bajo que las otras ofertas de este producto ('+money(mid)+' '+perUnit(d.unit)+').'};

    return null;
  }

  }
  return null;
}

function settlementRows(v){

}

  }
  if(f.id==='apply'){
    var name=val('a-name').trim(), cuit=String(val('a-cuit')).replace(/\D/g,''), email=val('a-email').trim();
    var keep={name:name,cuit:val('a-cuit'),contact:val('a-contact'),email:email,phone:val('a-phone'),type:val('a-type')};
    var pass=val('a-pass'), dup=db.vendors.some(function(v){ return norm(v.email)===norm(email)||norm(v.user)===norm(email); });
    var err=!name?'Falta la razón social.':(cuit.length!==11?'El CUIT tiene que tener 11 dígitos.':(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'Revisá el email: no parece válido.':(dup?'Ya hay una cuenta con ese email.':(pass.length<6?'La clave tiene que tener al menos 8 caracteres.':''))));
    if(err){
      ui.formError=err; ui.applied=false; render();
      ['name','cuit','contact','email','phone','type'].forEach(function(k){ var el=document.getElementById('a-'+k); if(el) el.value=keep[k]; });
      var fe=document.getElementById(!name?'a-name':(cuit.length!==11?'a-cuit':(pass.length<6&&!dup&&/@/.test(email)?'a-pass':'a-email'))); if(fe) fe.focus();
      return;
    }
    db.vendors.push({id:'v'+(db.nextId++),name:name,type:keep.type,cuit:cuit.slice(0,2)+'-'+cuit.slice(2,10)+'-'+cuit.slice(10),contact:keep.contact.trim(),email:email,phone:keep.phone.trim(),status:'pending',mp:false,commission:null,user:norm(email),hash:pwHash(pass),since:today(),logins:[],act:[{t:new Date().toISOString(),what:'pidió el alta'}]});
    notify('vendor','vendedores','Nueva solicitud de alta: '+name+' ('+keep.type+'). Revisala y aprobala para que pueda vender.',db.vendors[db.vendors.length-1].id);
    save(); ui.formError=''; ui.applied=true; render(); toast('Solicitud enviada');
    var fm=document.getElementById('alta'); if(fm&&fm.scrollIntoView){ try{ fm.scrollIntoView({block:'start'}); }catch(e){} }
  } else if(f.id==='dform'){
    var v=me(), ch=[], em=val('d-email').trim(), nm=val('d-name').trim().slice(0,40);
    if(!nm){ var eb=document.getElementById('d-err'); eb.textContent='Falta el nombre de la marca.'; eb.hidden=false; document.getElementById('d-name').focus(); return; }
    if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ var eb2=document.getElementById('d-err'); eb2.textContent='Revisá el email: no parece válido.'; eb2.hidden=false; document.getElementById('d-email').focus(); return; }
    VFIELDS.forEach(function(g){ g[1].forEach(function(fl){ var nv=val('d-'+fl[0]).trim(); if(fl[0]==='name') nv=nm; if(nv!==String(v[fl[0]]||'')){ ch.push(fl[1].toLowerCase()); v[fl[0]]=nv; } }); });
    var zs=[].slice.call(document.querySelectorAll('[data-zone]')).filter(function(c){ return c.checked; }).map(function(c){ return c.getAttribute('data-zone'); });
    if(zs.join()!==(v.zones||[]).join()){ ch.push('zonas de envío'); v.zones=zs; }
    if(ch.length){ notify('data','vendedores',v.name+' actualizó sus datos: '+ch.join(', '),v.id); vact(v,'actualizó sus datos ('+ch.join(', ')+')'); }
    save(); rerender(); toast(ch.length?'Datos guardados':'No había cambios');
  } else if(f.id==='pform'){
    var cur=offer(ui.editId); if(!cur||cur.vendorId!==ui.vendorId) return;
    var np=digits(val('p-price')), st=val('p-stock'), ut=val('p-units').trim(), lt=val('p-low').trim();
    if(np<=0){ var box=document.getElementById('p-err'); box.textContent='El precio tiene que ser mayor a cero.'; box.hidden=false; document.getElementById('p-price').focus(); return; }
    var d={category:cur.category,model:cur.model,size:cur.size,unit:cur.unit,price:np};
    var odd=np!==cur.price?priceCheck(d,cur.id,ui.vendorId,cur.price):null, okp=document.getElementById('p-okprice');
    if(odd&&!(okp&&okp.checked)){
      refreshWarn(); var b2=document.getElementById('p-err'); if(b2){ b2.textContent='El precio parece raro. Revisalo o confirmá que está bien.'; b2.hidden=false; }
      var ok2=document.getElementById('p-okprice'); if(ok2){ try{ ok2.scrollIntoView({block:'center'}); }catch(e){} ok2.focus(); }
      return;
    }
    var tiers; try{ tiers=readVolume(); }catch(err){ var eb=document.getElementById('p-err'); eb.textContent=err.message; eb.hidden=false; return; }
    cur.volumeTiers=tiers;cur.minQty=Math.max(1,Number(val('p-min'))||1);
    var nu=ut===''?null:digits(ut), was=cur.price;
    cur.stock=st; cur.lowAt=lt===''?null:digits(lt);
    applyPU(cur,np,nu,odd);
    vact(me(),'actualizó '+cur.model+' '+cur.size+(np!==was?': precio '+money(was)+' → '+money(np):'')+' · stock '+stockName(cur.stock)+(cur.units!=null?' ('+cur.units+')':''));
    save(); go('panel',{tab:'productos'}); toast(odd?'Guardado. Como el precio es muy distinto, pasa por revisión antes de mostrarse.':'Cambios guardados');
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target, x;
  if(t.id==='promo-mode'||t.id==='promo-zone'){var active=val('promo-mode')!=='none';document.getElementById('promo-zone').disabled=!active;document.getElementById('promo-threshold').disabled=val('promo-mode')!=='from';document.getElementById('promo-postal').disabled=!active||val('promo-zone')!=='amba';return;}
  if(t.dataset&&t.dataset.units){
    x=offer(t.dataset.units); if(!x||x.vendorId!==ui.vendorId) return;
    var was=x.units; x.units=t.value.trim()===''?null:digits(t.value);
    if(x.units===0&&x.stock==='stock') x.stock='none'; else if(x.units>0&&x.stock==='none') x.stock='stock';
    if(was!==x.units) vact(me(),(x.units==null?'dejó de contar unidades de ':'cargó '+x.units+' unidades de ')+x.model+' '+x.size);
    save(); rerender(t.id); toast(x.units==null?'Sin cuenta de unidades':(stockState(x)==='none'?'Sin stock: deja de mostrarse hasta que repongas':(stockState(x)==='low'?'Guardado. Quedan pocas: bajo stock':'Stock actualizado')));
    return;
  }
  if(t.dataset&&t.dataset.pf){ ui.pf[t.dataset.pf]=t.value; ui.bulkVals=null; ui.bulkOdd=null; rerender(t.id); return; }
  if(t.id==='n-month'){ ui.nMonth=t.value; rerender(t.id); return; }
  if(t.id==='sheet-file'){ var fl=t.files&&t.files[0]; if(!fl) return; var fr=new FileReader(); fr.onload=function(){ ui.imp=parseSheet(String(fr.result||'')); rerender(); }; fr.onerror=function(){ toast('No se pudo leer el archivo.'); }; fr.onload=function(){var bytes=fr.result,text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(e){text=new TextDecoder('windows-1252').decode(bytes);}ui.imp=parseSheet(text);rerender();};fr.readAsArrayBuffer(fl); return; }
  if(t.id==='mp-name'){ x=me(); var nn=t.value.trim().slice(0,60); if(nn!==(x.mpName||'')){ x.mpName=nn; vact(x,'cargó el nombre de su cuenta de Mercado Pago: '+(nn||'(vacío)')); if(!mpNameOk(x)) notify('mp','vendedores','El nombre de Mercado Pago de '+x.name+' no coincide con su marca: figura “'+nn+'”',x.id); save(); rerender(t.id); toast(mpNameOk(x)?'Guardado':'Guardado. Ojo: no coincide con tu marca'); } return; }
  if(t.id==='low-def'){ x=me(); x.lowAt=t.value.trim()===''?null:digits(t.value); save(); rerender(t.id); toast('Te avisamos cuando queden '+(x.lowAt!=null?x.lowAt:10)+' unidades o menos'); return; }
  if(t.id==='p-size'||t.id==='p-unit'){ refreshWarn(); return; }
  if(t.id!=='p-cat'&&t.id!=='p-model') return;
  var ms=document.getElementById('p-model'), ss=document.getElementById('p-size');
  if(t.id==='p-cat') ms.innerHTML=modelOpts(t.value,null);
  ss.innerHTML=sizeOpts(val('p-cat'),ms.value,null);
  document.getElementById('p-info').innerHTML=modelInfo(val('p-cat'),ms.value);
  refreshWarn();
});
document.addEventListener('input',function(ev){
  var t=ev.target, n, p;
  if(t.id==='pf-q'){ ui.pf.q=t.value; var pos=t.selectionStart; rerender('pf-q'); var q2=document.getElementById('pf-q'); if(q2){ try{ q2.setSelectionRange(pos,pos); }catch(e){} } return; }
  if(t.id==='sim-range'){ n=digits(t.value); ui.sim=n; p=db.commission; setText('sim-total',money(n)); setText('sim-net',money(n*(100-p)/100)); setText('sim-com',money(n*p/100)); }
  else if(t.id==='p-price'){ n=digits(t.value); p=pctOf(me()); setText('pv-price',money(n)); setText('pv-com',money(n*p/100)); setText('pv-net',money(n*(100-p)/100)); refreshWarn(); }
});
render();
})();
</script>
</body>
