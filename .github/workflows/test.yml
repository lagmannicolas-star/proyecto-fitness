name: Pruebas Nexo Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { tail -n 40 test-output.txt | tr -d '\r' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=npm test::/'; echo; exit 1; }
