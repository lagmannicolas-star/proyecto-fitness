name: Pruebas Nexo Fit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.txt; then
            # Deja el error visible como anotación del run (se ve sin abrir el log completo).
            msg=$(grep -v '^\s*at ' test-output.txt | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Fallo en npm test::${msg}"
            exit 1
          fi
